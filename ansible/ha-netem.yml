---
- name: Apply or clear tc netem impairment on gruezi HA traffic
  hosts: '{{ gruezi_netem_hosts | default("gruezi_ha_lab") }}'
  gather_facts: false
  become: true
  vars:
    gruezi_netem_state: present
    gruezi_netem_args: delay 250ms 50ms
    gruezi_ha_peer_port: 9375
  pre_tasks:
    - name: Validate netem state
      ansible.builtin.assert:
        that:
          - gruezi_netem_state in ['present', 'absent']
        fail_msg: gruezi_netem_state must be 'present' or 'absent'

    - name: Validate netem arguments when applying impairment
      ansible.builtin.assert:
        that:
          - gruezi_netem_args | trim | length > 0
        fail_msg: gruezi_netem_args cannot be empty when gruezi_netem_state is present
      when: gruezi_netem_state == 'present'

    - name: Validate HA interface variable
      ansible.builtin.assert:
        that:
          - gruezi_interface is defined
          - gruezi_interface | trim | length > 0
        fail_msg: gruezi_interface must be defined in the HA lab inventory or group vars

    - name: Validate peer IP variable
      ansible.builtin.assert:
        that:
          - gruezi_peer_ip is defined
          - gruezi_peer_ip | trim | length > 0
        fail_msg: gruezi_peer_ip must be defined for each HA lab host

  tasks:
    - name: Apply tc netem impairment to HA UDP traffic only
      ansible.builtin.shell: |
        set -euo pipefail
        tc qdisc replace dev {{ gruezi_interface }} root handle 1: prio
        tc qdisc replace dev {{ gruezi_interface }} parent 1:3 handle 30: netem {{ gruezi_netem_args }}
        tc filter replace dev {{ gruezi_interface }} protocol ip parent 1: prio 3 u32 \
          match ip dst {{ gruezi_peer_ip }}/32 \
          match ip protocol 17 0xff \
          match ip dport {{ gruezi_ha_peer_port }} 0xffff \
          flowid 1:3
      args:
        executable: /bin/bash
      when: gruezi_netem_state == 'present'
      changed_when: true

    - name: Observe qdiscs before restoration
      ansible.builtin.command:
        argv: [tc, -j, qdisc, show, dev, '{{ gruezi_interface }}']
      register: gruezi_netem_before_query
      changed_when: false
      when: gruezi_netem_state == 'absent'

    - name: Parse qdiscs before restoration
      ansible.builtin.set_fact:
        gruezi_netem_before: '{{ gruezi_netem_before_query.stdout | from_json }}'
      when: gruezi_netem_state == 'absent'

    - name: Require complete qdisc identities before restoration
      ansible.builtin.assert:
        that:
          - gruezi_netem_before is sequence and gruezi_netem_before is not string and gruezi_netem_before is not mapping
          - gruezi_netem_before | select('mapping') | list | length == gruezi_netem_before | length
          - gruezi_netem_before | selectattr('kind', 'defined') | list | length == gruezi_netem_before | length
          - gruezi_netem_before | selectattr('handle', 'defined') | list | length == gruezi_netem_before | length
          - gruezi_netem_before | map(attribute='kind') | select('string') | list | length == gruezi_netem_before | length
          - gruezi_netem_before | map(attribute='handle') | select('string') | list | length == gruezi_netem_before | length
          - gruezi_netem_before | map(attribute='kind') | reject('match', '^[a-zA-Z][a-zA-Z0-9_-]*$') | list | length == 0
          - gruezi_netem_before | map(attribute='handle') | reject('match', '^[0-9a-fA-F]+:$') | list | length == 0
        fail_msg: Cannot establish qdisc state; manual recovery required
      when: gruezi_netem_state == 'absent'

    - name: Clear tc netem impairment from the HA interface
      ansible.builtin.command:
        argv:
          - tc
          - qdisc
          - del
          - dev
          - '{{ gruezi_interface }}'
          - root
      register: gruezi_netem_clear
      changed_when: gruezi_netem_clear.rc == 0
      when:
        - gruezi_netem_state == 'absent'
        - gruezi_netem_before | selectattr('kind', 'equalto', 'netem') | list | length > 0 or gruezi_netem_before | selectattr('handle', 'equalto', '1:') | list | length > 0

    - name: Observe qdiscs after restoration
      ansible.builtin.command:
        argv: [tc, -j, qdisc, show, dev, '{{ gruezi_interface }}']
      register: gruezi_netem_after_query
      changed_when: false
      when: gruezi_netem_state == 'absent'

    - name: Parse qdiscs after restoration
      ansible.builtin.set_fact:
        gruezi_netem_after: '{{ gruezi_netem_after_query.stdout | from_json }}'
      when: gruezi_netem_state == 'absent'

    - name: Confirm managed netem and root qdisc are absent
      ansible.builtin.assert:
        that:
          - gruezi_netem_after is sequence and gruezi_netem_after is not string and gruezi_netem_after is not mapping
          - gruezi_netem_after | select('mapping') | list | length == gruezi_netem_after | length
          - gruezi_netem_after | selectattr('kind', 'defined') | list | length == gruezi_netem_after | length
          - gruezi_netem_after | selectattr('handle', 'defined') | list | length == gruezi_netem_after | length
          - gruezi_netem_after | map(attribute='kind') | select('string') | list | length == gruezi_netem_after | length
          - gruezi_netem_after | map(attribute='handle') | select('string') | list | length == gruezi_netem_after | length
          - gruezi_netem_after | map(attribute='kind') | reject('match', '^[a-zA-Z][a-zA-Z0-9_-]*$') | list | length == 0
          - gruezi_netem_after | map(attribute='handle') | reject('match', '^[0-9a-fA-F]+:$') | list | length == 0
          - gruezi_netem_after | selectattr('kind', 'equalto', 'netem') | list | length == 0
          - gruezi_netem_after | selectattr('handle', 'equalto', '1:') | list | length == 0
        fail_msg: Netem restoration is unconfirmed; manual recovery required
      when: gruezi_netem_state == 'absent'

    - name: Show current qdisc state
      ansible.builtin.command:
        argv:
          - tc
          - qdisc
          - show
          - dev
          - '{{ gruezi_interface }}'
      register: gruezi_netem_show
      changed_when: false
      when: gruezi_netem_state == 'present'

    - name: Show current tc filters
      ansible.builtin.command:
        argv:
          - tc
          - filter
          - show
          - dev
          - '{{ gruezi_interface }}'
      register: gruezi_netem_filter_show
      changed_when: false
      when: gruezi_netem_state == 'present'

    - name: Display current qdisc state
      ansible.builtin.debug:
        msg: '{{ inventory_hostname }} qdisc -> {{ gruezi_netem_show.stdout }}'
      when: gruezi_netem_state == 'present'

    - name: Display current filter state
      ansible.builtin.debug:
        msg: '{{ inventory_hostname }} filter -> {{ gruezi_netem_filter_show.stdout }}'
      when: gruezi_netem_state == 'present'
