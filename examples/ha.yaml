---
mode: ha
node:
  id: node-a
ha:
  failure_policy: strict
  peer_id: node-b
  bind: 0.0.0.0:9375
  interface: eth0
  group_id: cluster-ha
  addresses: [10.0.0.10/24, fd00::10/64]
  peer: 10.0.0.2:9375
  priority: 100
  preempt: false
  advert_interval_ms: 1000
  dead_factor: 3
  hold_down_ms: 3000
  jitter_ms: 100
  auth:
    key: replace-with-a-private-shared-key
