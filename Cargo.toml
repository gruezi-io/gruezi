[package]
name = "gruezi"
version = "0.1.4"
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "Service Discovery & Distributed Key-Value Store"
license = "BSD-3-Clause"
repository = "https://github.com/gruezi-io/gruezi"
readme = "README.md"
keywords = ["service-discovery", "distributed", "raft", "key-value", "consensus"]
categories = ["command-line-utilities", "network-programming"]
edition = "2024"

[features]
default = []
telemetry = [
    "dep:base64",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tonic",
    "dep:tracing-opentelemetry",
    "dep:ulid",
]

[lints.rust]
warnings = "deny"

[lints.clippy]
# Allow unstable/opinionated lints (lower priority so individual lints can override)
nursery = { level = "allow", priority = -1 }

# Enforce pedantic lints
pedantic = "deny"

# Core lint groups
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
complexity = "deny"

# Safety-critical lints
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"

# Performance + memory reliability
needless_borrow = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = { version = "0.23", optional = true }
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
opentelemetry = { version = "0.33.0", optional = true }
opentelemetry-otlp = { version = "0.33.0", features = ["grpc-tonic", "gzip-tonic", "tls-ring", "tls-roots", "trace"], optional = true }
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14.6", features = ["tls-native-roots"], optional = true }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", optional = true }

[build-dependencies]
built = { version = "0.8.1", features = ["git2"] }

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gruezi", dest = "/usr/bin/gruezi", mode = "0755" },
    { source = "contrib/systemd/gruezi.service", dest = "/etc/systemd/system/gruezi.service", mode = "0644" },
    { source = "contrib/systemd/gruezi.env.example", dest = "/etc/gruezi/gruezi.env", mode = "0640" },
]

[package.metadata.deb]
assets = [
  ["target/release/gruezi", "/usr/bin/gruezi", "755"],
  ["contrib/systemd/gruezi.service", "/etc/systemd/system/gruezi.service", "644"],
  ["contrib/systemd/gruezi.env.example", "/etc/gruezi/gruezi.env", "640"],
]
depends = ""
maintainer-scripts = "contrib/debian"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
