[package]
name = "gruezi"
version = "0.1.10"
authors = ["Nicolas Embriz <nbari@tequila.io>"]
description = "Service Discovery & Distributed Key-Value Store"
license = "BSD-3-Clause"
repository = "https://github.com/gruezi-io/gruezi"
readme = "README.md"
keywords = ["service-discovery", "distributed", "raft", "key-value", "consensus"]
categories = ["command-line-utilities", "network-programming"]
edition = "2024"

[features]
default = []
telemetry = [
    "dep:base64",
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tonic",
    "dep:tracing-opentelemetry",
    "dep:ulid",
]

[lints.rust]
warnings = "deny"

[lints.clippy]
# Allow unstable/opinionated lints (lower priority so individual lints can override)
nursery = { level = "allow", priority = -1 }

# Enforce pedantic lints
pedantic = "deny"

# Core lint groups
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
complexity = "deny"

# Safety-critical lints
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
await_holding_lock = "deny"

# Performance + memory reliability
needless_borrow = "deny"
needless_collect = "deny"
large_stack_arrays = "deny"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = { version = "0.23", optional = true }
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
getrandom = "0.4"
hmac = "0.13.0"
libc = "0.2"
opentelemetry = { version = "0.33.1", optional = true }
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic", "gzip-tonic", "tls-ring", "tls-roots", "trace"], optional = true }
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
sha2 = "0.11.1"
socket2 = "0.6"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14.9", features = ["tls-native-roots"], optional = true }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34.0", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = { version = "3.0.0", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
built = { version = "0.8.1", features = ["git2"] }

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/gruezi", dest = "/usr/bin/gruezi", mode = "0755" },
    { source = "contrib/systemd/gruezi.service", dest = "/etc/systemd/system/gruezi.service", mode = "0644" },
    { source = "contrib/systemd/gruezi.env.example", dest = "/etc/gruezi/gruezi.env", mode = "0640" },
    { source = "contrib/mariadb/gruezi-mariadb-adapter", dest = "/usr/libexec/gruezi/gruezi-mariadb-adapter", mode = "0755" },
    { source = "contrib/mariadb/mariadb-adapter.conf.example", dest = "/usr/share/doc/gruezi/examples/mariadb-adapter.conf.example", mode = "0644" },
    { source = "contrib/systemd/gruezi-sysusers.conf", dest = "/usr/lib/sysusers.d/gruezi.conf", mode = "0644" },
    { source = "contrib/systemd/gruezi-tmpfiles.conf", dest = "/usr/lib/tmpfiles.d/gruezi.conf", mode = "0644" },
]
# Same account and directory setup as the Debian package (see contrib/debian/postinst).
post_install_script = "contrib/debian/postinst"

[package.metadata.deb]
assets = [
  ["target/release/gruezi", "/usr/bin/gruezi", "755"],
  ["contrib/systemd/gruezi.service", "/etc/systemd/system/gruezi.service", "644"],
  ["contrib/systemd/gruezi.env.example", "/etc/gruezi/gruezi.env", "640"],
  ["contrib/mariadb/gruezi-mariadb-adapter", "/usr/libexec/gruezi/gruezi-mariadb-adapter", "755"],
  ["contrib/mariadb/mariadb-adapter.conf.example", "/usr/share/doc/gruezi/examples/mariadb-adapter.conf.example", "644"],
  ["contrib/systemd/gruezi-sysusers.conf", "/usr/lib/sysusers.d/gruezi.conf", "644"],
  ["contrib/systemd/gruezi-tmpfiles.conf", "/usr/lib/tmpfiles.d/gruezi.conf", "644"],
]
depends = ""
maintainer-scripts = "contrib/debian"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
