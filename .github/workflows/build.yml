---
name: Test & Build

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  # Native Linux builds, one per supported architecture, using the same actions the
  # release uses: they build and run the binary, then build and check the packages.
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs:
      - test

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the binary
        uses: ./.github/actions/build-binary
        with:
          target: ${{ matrix.target }}

      - name: Build and check the Linux packages
        uses: ./.github/actions/linux-packages
        with:
          target: ${{ matrix.target }}

  # The crate must package and pass the publish checks. Nothing is published.
  crate:
    name: Crate package
    runs-on: ubuntu-latest
    needs:
      - test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain

      - name: Package the crate
        run: cargo package --locked

      - name: Check the crate would publish
        run: cargo publish --dry-run --locked

  # One aggregate check for branch protection and the release flow: it passes only
  # when every gating job succeeded, so the required check never depends on job or
  # matrix names. Coverage is reported, not a gate.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - test
      - build
      - crate
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job finished with '${result}'."
              exit 1
            fi
          done
