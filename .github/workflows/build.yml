---
name: Test & Build

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  coverage:
    uses: ./.github/workflows/coverage.yml
    secrets: inherit

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs:
      - test

    strategy:
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: macos
            os: macos-latest
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get package name from Cargo.toml
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=$(awk -F '"' '/^name = / {print $2; exit}' Cargo.toml)
          echo "name=$PACKAGE_NAME" >> $GITHUB_OUTPUT
          echo "Package name: $PACKAGE_NAME"

      - name: Branch name
        run: echo "${GITHUB_REF##*/}"

      - name: Get the release version from the tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
          cache: false

      - run: sudo apt -y install musl-dev musl-tools
        if: matrix.build == 'linux'

      - name: Build (Linux musl)
        if: matrix.build == 'linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build
        if: matrix.build != 'linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

  # One aggregate check for branch protection and the release flow: it passes only
  # when every gating job succeeded, so the required check never depends on job or
  # matrix names. Coverage is reported, not a gate.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to have succeeded
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [[ "${result}" != "success" ]]; then
              echo "::error::A required job finished with '${result}'."
              exit 1
            fi
          done
