---
name: Release
# allow: SIZE_OK — one workflow file owns the whole release pipeline; its jobs are the natural split.

# One dispatch publishes exactly the commit it names: nothing is bumped, committed,
# branched or staged along the way. The run is started by `just release` on develop
# with the commit's full SHA and a unique dispatch marker; the guard refuses anything
# but that exact commit, whose own Test & Build already succeeded. What publishes is
# what this run builds and verifies here. `main` is moved by the local recipe only
# after this run has succeeded; the workflow never touches it.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full commit SHA of the commit to publish.
        required: true
      dispatch_id:
        description: Nonsecret unique marker of this invocation.
        required: true

run-name: Release ${{ inputs.expected_sha }} dispatch ${{ inputs.dispatch_id }}

# One release at a time. A pending dispatch waits its turn instead of being
# cancelled: it is a real release request whose author is watching it.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

# Read-only by default. The GitHub release job writes the release and attests its
# files; the publish job requests a short-lived crates.io token through OIDC (Trusted
# Publishing). No environment is bound to a publishing job and no registry secret is
# stored.
permissions:
  contents: read

jobs:
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      name: ${{ steps.info.outputs.name }}
      version: ${{ steps.info.outputs.version }}
      rust: ${{ steps.rust.outputs.version }}
    steps:
      # The workflow's own commit is checked out explicitly, so every job and file
      # below belongs to the dispatched SHA.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Read the package name and version
        id: info
        uses: ./.github/actions/crate-info

      # `stable` moves every few weeks and a failed-job re-run can run a leg hours
      # later, so the compiler is resolved once here. Every job of this run installs
      # exactly this version and sets RUSTUP_TOOLCHAIN to it.
      - name: Resolve the Rust toolchain for this run
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          version="$(rustc +stable --version | awk '{print $2}')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not resolve stable to an exact version."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "This release is built with Rust ${version}."

      - name: Check the dispatched commit can be released
        id: check
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          PACKAGE_VERSION: ${{ steps.info.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/heads/develop ]]; then
            echo "::error::Run the release on develop (got ${GITHUB_REF})."
            exit 1
          fi
          if [[ ! "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::expected_sha must be a full lowercase commit SHA."
            exit 1
          fi
          if [[ "${EXPECTED_SHA}" != "${GITHUB_SHA}" || "$(git rev-parse HEAD)" != "${GITHUB_SHA}" ]]; then
            echo "::error::This run is for a different commit than expected_sha; dispatch again."
            exit 1
          fi
          if [[ ! "${DISPATCH_ID}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::dispatch_id must use only letters, digits, dot, underscore and dash."
            exit 1
          fi
          version="${PACKAGE_VERSION}"
          if [[ ! "${version}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Cargo.toml has no canonical X.Y.Z version; bump the version first."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main has commits that develop does not; merge main into develop first."
            exit 1
          fi
          echo "Dispatch ${DISPATCH_ID} checks out ${version} at ${EXPECTED_SHA}."

      - name: Check the target tag
        id: tag
        uses: ./.github/actions/release-version-gate
        with:
          version: ${{ steps.info.outputs.version }}
          token: ${{ github.token }}

      # `CI OK` is Test & Build's aggregate of every gating job, and the run that
      # produced it must be this repository's build.yml push run for exactly this
      # commit on develop. A check of the right name on another commit, run, fork or
      # event proves nothing.
      - name: Require trusted Test & Build on this commit
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          raw="$(gh api "repos/${repo}/actions/workflows/build.yml/runs?branch=develop&event=push&head_sha=${GITHUB_SHA}")" ||
            { echo "::error::Could not list the Test & Build runs."; exit 1; }
          runs="$(jq -s --arg sha "${GITHUB_SHA}" --arg repo "${repo}" \
            '[.[].workflow_runs[] | select(.path == ".github/workflows/build.yml" and .event == "push" and .head_branch == "develop" and .head_sha == $sha and (.repository | objects | .full_name == $repo))] | sort_by(.id) | reverse' \
            <<<"${raw}")"
          run_id="$(jq -r '.[0].id // empty' <<<"${runs}")"
          if [[ -z "${run_id}" ]]; then
            echo "::error::No completed Test & Build run of ${GITHUB_SHA} on develop; wait for CI."
            exit 1
          fi
          jobs="$(gh api "repos/${repo}/actions/runs/${run_id}/jobs?filter=latest")" ||
            { echo "::error::Could not list the jobs of run ${run_id}."; exit 1; }
          ok="$(jq --arg sha "${GITHUB_SHA}" \
            '[.jobs[] | select(.name == "CI OK" and .head_sha == $sha and .status == "completed" and .conclusion == "success")] | length' \
            <<<"${jobs}")"
          if [[ "${ok}" != 1 ]]; then
            echo "::error::Run ${run_id} has no successful CI OK job for ${GITHUB_SHA}."
            exit 1
          fi
          echo "Test & Build run ${run_id} passed CI OK for ${GITHUB_SHA}."

  build:
    name: Build and package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: [guard]
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      NAME: ${{ needs.guard.outputs.name }}
      RUSTUP_TOOLCHAIN: ${{ needs.guard.outputs.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build the binary
        uses: ./.github/actions/build-binary
        with:
          target: ${{ matrix.target }}
          toolchain: ${{ needs.guard.outputs.rust }}

      - name: Build and check the Linux packages
        uses: ./.github/actions/linux-packages
        with:
          target: ${{ matrix.target }}

      - name: Build the archive
        id: archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          dirname="${NAME}-${VERSION}-${TARGET}"
          mkdir "${dirname}"
          mv "target/${TARGET}/release/${NAME}" "${dirname}/"
          tar -czf "dist/${dirname}.tar.gz" "${dirname}"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          retention-days: 90
          if-no-files-found: error

  crate:
    name: Crate package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [guard]
    env:
      RUSTUP_TOOLCHAIN: ${{ needs.guard.outputs.rust }}
    outputs:
      sha256: ${{ steps.sum.outputs.sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # Cargo's own verification build, and the registry's own publish checks. The
      # exact bytes are kept: the release publishes them and the publish job proves
      # its repackage produced the same bytes.
      - name: Package and verify the crate
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          cargo publish --dry-run --locked

      - name: Checksum the crate
        id: sum
        shell: bash
        run: |
          set -euo pipefail
          mkdir crate
          cp target/package/*.crate crate/
          echo "sha256=$(sha256sum crate/*.crate | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload the crate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate
          path: crate/*
          retention-days: 90
          if-no-files-found: error

  github:
    name: GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [guard, build, crate]
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.guard.outputs.version }}
      NAME: ${{ needs.guard.outputs.name }}
      COMMIT: ${{ github.sha }}
    steps:
      # Full history and tags: the release notes list the commits since the previous
      # release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Download the verified crate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: ${{ runner.temp }}/crate

      # Exactly the supported downloads, each built by one of the two native jobs:
      # two archives, two DEBs and two RPMs. Nothing is published from an inventory
      # that is missing a file, carries a stray one, or was replaced after the build.
      - name: Check the release files
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          expected="$(
            {
              for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
                echo "${NAME}-${VERSION}-${target}.tar.gz"
              done
              echo "${NAME}_${VERSION}-1_amd64.deb"
              echo "${NAME}_${VERSION}-1_arm64.deb"
              echo "${NAME}-${VERSION}-1.x86_64.rpm"
              echo "${NAME}-${VERSION}-1.aarch64.rpm"
            } | sort
          )"
          actual="$(find "${RUNNER_TEMP}/dist" -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::The release files are not exactly the expected set."
            diff <(echo "${expected}") <(echo "${actual}") || true
            exit 1
          fi

      # The crate the release verifies is the crate this run packaged and checked.
      - name: Check the verified crate
        id: crate
        shell: bash
        env:
          EXPECTED: ${{ needs.crate.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ ! "${EXPECTED}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::The crate job reported no checksum."
            exit 1
          fi
          shopt -s nullglob
          files=("${RUNNER_TEMP}"/crate/*.crate)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one verified crate."
            exit 1
          fi
          if [[ "$(sha256sum "${files[0]}" | awk '{print $1}')" != "${EXPECTED}" ]]; then
            echo "::error::The downloaded crate does not match the crate job's checksum."
            exit 1
          fi
          echo "The verified crate ${files[0]##*/} is the one this run packaged."

      - name: Write the checksums
        id: sums
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/dist"
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      # A signed statement that this run built exactly these bytes. What users download
      # and the separately published crate carry the same attestation.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/dist/*
            ${{ runner.temp }}/crate/*.crate

      # The notes are the commit subjects since the previous release (the version bump
      # itself left out), so no changelog is kept by hand and every re-run writes the
      # same text.
      - name: Write the release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "${GITHUB_SHA}" 2>/dev/null || true)"
          range="${GITHUB_SHA}"
          [[ -z "${previous}" ]] || range="${previous}..${GITHUB_SHA}"
          changes="$(git log --no-merges --format='- %s (%h)' "${range}" | grep -viE '^- (bump version to|Bump version to) [0-9]+\.[0-9]+\.[0-9]+ ' || true)"
          {
            echo "## Changes"
            echo
            echo "${changes:-- Only the version bump.}"
            if [[ -n "${previous}" ]]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${VERSION}"
            fi
            echo
            echo "## Verify a download"
            echo
            echo '```sh'
            echo 'sha256sum --check --ignore-missing SHA256SUMS'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo '```'
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      # What exists already decides what this job may touch. A published release is
      # never edited; only its target and bytes are verified below. A draft is the
      # half of a previous attempt at this commit and is replaced; anything else is
      # not ours to touch.
      - name: Look up any existing release
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          state=absent
          pages=()
          for page in 1 2 3 4 5; do
            out="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")" ||
              { echo "::error::GitHub could not list releases."; exit 1; }
            pages+=("${out}")
            if [[ "$(jq length <<<"${out}")" -lt 100 ]]; then break; fi
          done
          rows="$(jq -sc --arg tag "${VERSION}" '[.[][] | select(.tag_name == $tag)]' <<<"$(printf '%s\n' "${pages[@]}")")"
          count="$(jq length <<<"${rows}")"
          if [[ "${count}" == 1 ]]; then
            id="$(jq -r '.[0].id' <<<"${rows}")"
            if [[ "$(jq -r '.[0].draft' <<<"${rows}")" == true ]]; then
              state=draft
            else
              state=public
            fi
            echo "id=${id}" >> "$GITHUB_OUTPUT"
          elif [[ "${count}" != 0 ]]; then
            echo "::error::GitHub reports ${count} releases for ${VERSION}."
            exit 1
          fi
          echo "state=${state}" >> "$GITHUB_OUTPUT"
          echo "Release ${VERSION} is ${state}."

      - name: Replace an existing draft
        id: draft
        if: steps.existing.outputs.state == 'draft'
        shell: bash
        env:
          RELEASE_ID: ${{ steps.existing.outputs.id }}
        run: |
          set -euo pipefail
          target="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq '.target_commitish')"
          if [[ "${target}" != "${COMMIT}" ]]; then
            echo "::error::The draft for ${VERSION} targets ${target}, not ${COMMIT}; not touching it."
            exit 1
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" ||
            { echo "::error::Could not remove the stale draft."; exit 1; }

      # Publishing creates the tag, so its absence and the version's place in the
      # release order are rechecked immediately before that happens. This also stops
      # a stale re-run after a newer version has been released.
      - name: Recheck the target tag
        id: gate
        if: steps.existing.outputs.state != 'public'
        uses: ./.github/actions/release-version-gate
        with:
          version: ${{ needs.guard.outputs.version }}
          token: ${{ github.token }}

      # Assets go on a draft first: publishing creates the tag at the tested commit, and
      # a release accepts no uploads afterwards. A re-run rewrites its own draft's bytes
      # before publishing again.
      - name: Create the draft release
        id: create
        if: steps.existing.outputs.state != 'public'
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${VERSION}" "${RUNNER_TEMP}"/dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --target "${COMMIT}" \
            --title "${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" ||
            { echo "::error::Could not create the draft release."; exit 1; }

      - name: Publish the release
        id: publish
        if: steps.existing.outputs.state != 'public'
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest ||
            { echo "::error::Could not publish the release."; exit 1; }

      # What a user can download must be exactly what this run built, and the tag must
      # sit on the tested commit. This runs every time, including when a re-run finds
      # the release already published.
      - name: Verify the published release
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}")"
          type="$(jq -r '.object.type' <<<"${ref}")"
          sha="$(jq -r '.object.sha' <<<"${ref}")"
          if [[ "${type}" == tag ]]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object.sha')"
          fi
          if [[ "${type}" != commit && "${type}" != tag ]]; then
            echo "::error::Tag ${VERSION} points at an unexpected object type."
            exit 1
          fi
          if [[ "${sha}" != "${COMMIT}" ]]; then
            echo "::error::Tag ${VERSION} points at ${sha}, not at ${COMMIT}."
            exit 1
          fi
          names="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${VERSION}" --jq '[.assets[].name] | sort | join("\n")')"
          expected="$(find "${RUNNER_TEMP}/dist" -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "${names}" != "${expected}" ]]; then
            echo "::error::Release ${VERSION} does not hold exactly this run's files."
            diff <(echo "${expected}") <(echo "${names}") || true
            exit 1
          fi
          published="${RUNNER_TEMP}/published"
          rm -rf "${published}"
          gh release download "${VERSION}" --repo "${GITHUB_REPOSITORY}" --dir "${published}" ||
            { echo "::error::Could not download the published files."; exit 1; }
          if ! diff <(cd "${RUNNER_TEMP}/dist" && sha256sum -- * | sort -k2) \
                    <(cd "${published}" && sha256sum -- * | sort -k2); then
            echo "::error::The published files differ from what this run built."
            exit 1
          fi
          echo "Release ${VERSION} is on ${COMMIT} with $(wc -l <<<"${expected}") verified files."

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [guard, github, crate]
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      NAME: ${{ needs.guard.outputs.name }}
      RUSTUP_TOOLCHAIN: ${{ needs.guard.outputs.rust }}
      RUST: ${{ needs.guard.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the release toolchain
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RUST}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The release names no exact toolchain."
            exit 1
          fi
          rustup toolchain install "${RUST}" --profile minimal
          rustc --version

      # Outside the checkout: cargo refuses to package a working tree with files git
      # does not know about, and this crate was verified by the crate job.
      - name: Download the verified crate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crate
          path: ${{ runner.temp }}/crate

      - name: Check the verified crate
        id: downloaded
        shell: bash
        env:
          EXPECTED: ${{ needs.crate.outputs.sha256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("${RUNNER_TEMP}"/crate/*.crate)
          if [[ ${#files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one verified crate."
            exit 1
          fi
          if [[ "$(sha256sum "${files[0]}" | awk '{print $1}')" != "${EXPECTED}" ]]; then
            echo "::error::The downloaded crate does not match the crate job's checksum."
            exit 1
          fi

      # cargo cannot upload a prepared .crate, so the same sources are repackaged with
      # the same compiler and uploaded only when the bytes match the verified crate.
      - name: Reproduce the verified crate
        id: repackage
        shell: bash
        env:
          EXPECTED: ${{ needs.crate.outputs.sha256 }}
        run: |
          set -euo pipefail
          cargo package --no-verify --locked ||
            { echo "::error::Could not repackage the crate."; exit 1; }
          actual="$(sha256sum "target/package/${NAME}-${VERSION}.crate" | awk '{print $1}')"
          if [[ "${actual}" != "${EXPECTED}" ]]; then
            echo "::error::The repackaged crate differs from the verified crate; not publishing."
            exit 1
          fi
          echo "The repackaged crate matches the verified crate."

      # Only a definite 404 means "not published yet": any other registry answer is
      # an error, not an absence.
      - name: Check crates.io
        id: registry
        shell: bash
        env:
          EXPECTED: ${{ needs.crate.outputs.sha256 }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/registry.json"
          code="$(curl -sS -A "${NAME}-release" -o "${body}" -w '%{http_code}' \
            "https://crates.io/api/v1/crates/${NAME}/${VERSION}")" ||
            { echo "::error::crates.io could not be reached."; exit 1; }
          if [[ "${code}" == 200 ]]; then
            got="$(jq -r '.version.checksum // empty' "${body}")"
            if [[ "${got}" != "${EXPECTED}" ]]; then
              echo "::error::crates.io has ${NAME} ${VERSION} with a different checksum."
              exit 1
            fi
            echo "${NAME} ${VERSION} is already on crates.io with the verified checksum."
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [[ "${code}" == 404 ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::crates.io answered HTTP ${code}."
            exit 1
          fi

      # Short-lived token from crates.io Trusted Publishing; no registry secret is
      # stored. It is only minted when the version is absent.
      - name: Get a crates.io token (Trusted Publishing)
        id: auth
        if: steps.registry.outputs.needed == 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        id: publish
        if: steps.registry.outputs.needed == 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          EXPECTED: ${{ needs.crate.outputs.sha256 }}
        run: |
          set -euo pipefail
          cargo publish --locked --no-verify ||
            { echo "::error::crates.io did not accept the crate."; exit 1; }
          body="${RUNNER_TEMP}/registry.json"
          for _ in $(seq 30); do
            code="$(curl -sS -A "${NAME}-release" -o "${body}" -w '%{http_code}' \
              "https://crates.io/api/v1/crates/${NAME}/${VERSION}")" ||
              { echo "::error::crates.io could not be reached after publishing."; exit 1; }
            if [[ "${code}" == 200 ]]; then
              got="$(jq -r '.version.checksum // empty' "${body}")"
              if [[ "${got}" == "${EXPECTED}" ]]; then
                echo "crates.io has ${NAME} ${VERSION} with the verified checksum."
                exit 0
              fi
              echo "::error::crates.io reports a different checksum for ${NAME} ${VERSION}."
              exit 1
            fi
            if [[ "${code}" != 404 ]]; then
              echo "::error::crates.io answered HTTP ${code} after publishing."
              exit 1
            fi
            sleep 10
          done
          echo "::error::crates.io does not report ${NAME} ${VERSION} yet."
          exit 1
