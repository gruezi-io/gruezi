---
name: Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Recovery: an existing X.Y.Z tag whose publishing failed. Run on main; it checks
          the tag like its own run would and publishes the tag's candidate artifacts.
        required: false
        default: ''

# Read-only by default. Jobs ask for more only where they need it: the manifest job
# signs build provenance, the GitHub release job writes the release, and the crates.io
# job requests a short-lived publish token through OIDC (Trusted Publishing).
permissions:
  contents: read

jobs:
  # Classifies the run for the jobs below.
  # - `candidate`: a manual (workflow_dispatch) run on a branch, which `just deploy`
  #   starts on the release candidate before any tag exists. It runs the whole
  #   pipeline (tests, every build and package, the crate packaged and verified) and
  #   keeps the artifacts plus a manifest of their SHA-256 sums, publishing nothing.
  # - `release`: a pushed X.Y.Z tag. It builds nothing. The signed tag names its
  #   candidate run; the guard checks that run and the tag's commit, and the jobs
  #   below publish exactly the manifest's files, so what ships is what was tested.
  # - `recover`: a manual run on main with `publish: X.Y.Z`, for a tag whose publishing
  #   failed in a way re-running its jobs cannot fix (a bug in the publish steps of the
  #   tagged workflow, or GitHub's 30-day re-run limit). It applies the same checks to
  #   that tag and publishes its candidate artifacts with main's workflow; the tag
  #   itself never changes.
  # - `test-tag`: any other tag, or a manual run on a tag: tests and builds only.
  # A manual run on main without `publish` is a candidate run too (`just release-dry-run`
  # starts one on the current branch): it builds and packages, publishing nothing.
  # A tag may only be published when its commit is on main, carries the tag's version
  # and passed Test & Build and its candidate run; a hand-pushed or stray tag stops here.
  guard:
    name: Release guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      version: ${{ steps.classify.outputs.version }}
      tag: ${{ steps.classify.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      candidate_run: ${{ steps.release.outputs.candidate_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Classify the run
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          tag=""
          if [[ "${EVENT}" == workflow_dispatch && -n "${PUBLISH:-}" ]]; then
            if [[ "${GITHUB_REF}" != refs/heads/main || ! "${PUBLISH}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A recovery run needs an X.Y.Z tag in 'publish' and must run on main."
              exit 1
            fi
            kind=recover
            tag="${PUBLISH}"
            version="${PUBLISH}"
          elif [[ "${EVENT}" == workflow_dispatch && "${GITHUB_REF}" == refs/heads/* ]]; then
            kind=candidate
          elif [[ "${EVENT}" == push && "${GITHUB_REF}" == refs/tags/* && "${GITHUB_REF_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            kind=release
            tag="${GITHUB_REF_NAME}"
          else
            kind=test-tag
            # Test builds are named after the ref; only safe characters reach file names.
            version="test"
            if [[ "${GITHUB_REF_NAME}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              version="${GITHUB_REF_NAME}"
            fi
          fi
          if [[ "${kind}" != test-tag && ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cargo.toml has no X.Y.Z version (found '${version}')."
            exit 1
          fi
          {
            echo "kind=${kind}"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"
          echo "${EVENT} on ${GITHUB_REF} classified as ${kind} (version ${version}${tag:+, tag ${tag}})."

      # Everything is read through the API, so it holds for any tag, however far main
      # has moved on since.
      - name: Require the tag's commit, version, Test & Build run and candidate run
        id: release
        if: steps.classify.outputs.kind == 'release' || steps.classify.outputs.kind == 'recover'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.classify.outputs.tag }}
          KIND: ${{ steps.classify.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          # The signed tag names the candidate run whose artifacts it releases.
          read -r type object <<<"$(gh api "repos/${repo}/git/ref/tags/${TAG}" --jq '"\(.object.type) \(.object.sha)"')"
          if [[ "${type}" != tag ]]; then
            echo "::error::${TAG} is not an annotated tag; refusing to release."
            exit 1
          fi
          read -r verified commit <<<"$(gh api "repos/${repo}/git/tags/${object}" --jq '"\(.verification.verified) \(.object.sha)"')"
          message="$(gh api "repos/${repo}/git/tags/${object}" --jq '.message')"
          if [[ "${verified}" != true ]]; then
            echo "::error::The signature of tag ${TAG} is not verified by GitHub; refusing to release."
            exit 1
          fi
          if [[ "${KIND}" == release && "${commit}" != "${GITHUB_SHA}" ]]; then
            echo "::error::Tag ${TAG} points at ${commit}, but this run is for ${GITHUB_SHA}."
            exit 1
          fi
          status="$(gh api "repos/${repo}/compare/${commit}...main" --jq '.status')"
          if [[ "${status}" != identical && "${status}" != ahead ]]; then
            echo "::error::Tag ${TAG} points at ${commit}, which is not on main (${status}); refusing to release."
            exit 1
          fi
          version="$(gh api "repos/${repo}/contents/Cargo.toml?ref=${commit}" --jq '.content' | base64 -d | awk -F'"' '/^version = /{print $2; exit}')"
          if [[ "${version}" != "${TAG}" ]]; then
            echo "::error::Tag ${TAG} does not match the package version ${version} at ${commit}; refusing to release."
            exit 1
          fi
          passed="$(gh run list --repo "${repo}" --workflow build.yml \
            --commit "${commit}" --event push --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "${passed}" ]]; then
            echo "::error::${commit} has no successful Test & Build run; refusing to release ${TAG}."
            exit 1
          fi
          candidate_run="$(sed -n 's/^Candidate run: \([0-9][0-9]*\)$/\1/p' <<<"${message}" | head -n 1)"
          if [[ -z "${candidate_run}" ]]; then
            echo "::error::Tag ${TAG} names no candidate run; refusing to publish untested artifacts."
            exit 1
          fi
          read -r head_sha event conclusion path <<<"$(gh api "repos/${repo}/actions/runs/${candidate_run}" \
            --jq '"\(.head_sha) \(.event) \(.conclusion) \(.path)"')"
          if [[ "${head_sha}" != "${commit}" || "${event}" != workflow_dispatch || "${conclusion}" != success || "${path}" != .github/workflows/release.yml* ]]; then
            echo "::error::Run ${candidate_run} is not a successful candidate run of ${commit} (${head_sha} ${event} ${conclusion} ${path})."
            exit 1
          fi
          {
            echo "commit=${commit}"
            echo "candidate_run=${candidate_run}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag ${TAG}: ${commit} is on main, passed Test & Build (run ${passed}) and candidate run ${candidate_run}."

  # Publishing (release, recover) reuses the candidate run's results: it neither tests
  # nor builds.
  test:
    needs: guard
    if: needs.guard.outputs.kind == 'candidate' || needs.guard.outputs.kind == 'test-tag'
    uses: ./.github/workflows/test.yml

  build:
    name: Build and package
    runs-on: ${{ matrix.os }}
    needs:
      - guard
      - test
    if: needs.guard.outputs.kind == 'candidate' || needs.guard.outputs.kind == 'test-tag'
    env:
      VERSION: ${{ needs.guard.outputs.version }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          - build: linux
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          - build: macos
            os: macos-15-intel
            target: x86_64-apple-darwin

          - build: macos
            os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get package name from Cargo.toml
        id: package
        shell: bash
        run: |
          PACKAGE_NAME=$(awk -F '"' '/^name = / {print $2; exit}' Cargo.toml)
          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "Package name: $PACKAGE_NAME"

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}

      # Linux-only prerequisites
      - name: Install system deps (musl)
        if: matrix.build == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-dev musl-tools

      # Pinned, so a candidate built later packages the same way; update deliberately.
      - name: Install packaging tools (RPM/DEB)
        if: matrix.build == 'linux'
        run: |
          cargo install cargo-generate-rpm --version 0.21.0 --locked
          cargo install cargo-deb --version 3.8.0 --locked

      # Build once for Linux (musl)
      - name: Build Linux (musl)
        if: matrix.build == 'linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip Linux binary
        if: matrix.build == 'linux'
        run: |
          BIN="target/${{ matrix.target }}/release/${{ steps.package.outputs.name }}"
          ls -al "$BIN"
          strip -s "$BIN" || true

      - name: Generate RPM
        if: matrix.build == 'linux'
        run: |
          cargo generate-rpm --target "${{ matrix.target }}"
          RPM_PATH="$(find "target/${{ matrix.target }}/generate-rpm" -type f -name '*.rpm' -print -quit)"
          echo "RPM_ASSET=$RPM_PATH" >> "$GITHUB_ENV"
          echo "RPM: $RPM_PATH"

      - name: Generate DEB (musl static)
        if: matrix.build == 'linux'
        run: |
          cargo deb --no-build --target "${{ matrix.target }}"
          DEB_PATH="$(find target/debian -maxdepth 1 -type f -name '*.deb' -print -quit)"
          echo "DEB_ASSET=$DEB_PATH" >> "$GITHUB_ENV"
          echo "DEB: $DEB_PATH"

      # Non-Linux builds (macOS)
      - name: Build
        if: matrix.build != 'linux'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build archive
        shell: bash
        run: |
          binary_name="${{ steps.package.outputs.name }}"
          dirname="$binary_name-${VERSION}-${{ matrix.target }}"
          mkdir "$dirname"

          mv "target/${{ matrix.target }}/release/$binary_name" "$dirname"
          tar -czf "$dirname.tar.gz" "$dirname"
          echo "ASSET=$dirname.tar.gz" >> "$GITHUB_ENV"

      - name: Collect the release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist
          for asset in "${ASSET}" "${RPM_ASSET:-}" "${DEB_ASSET:-}"; do
            [[ -z "${asset}" ]] || cp "${asset}" dist/
          done
          ls -al dist

      # The release tag publishes exactly these files, downloaded from this run.
      - name: Upload the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Package the crate once, with cargo's verification build, and keep it: the release
  # uploads the same bytes (cargo packaging is reproducible with the same toolchain)
  # without building again.
  crate:
    name: Crate package
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.kind == 'candidate' || needs.guard.outputs.kind == 'test-tag'
    outputs:
      rust: ${{ steps.package.outputs.rust }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: ./.github/actions/rust-toolchain

      # The artifact holds the crate alone: every file the release depends on is in the
      # manifest's checksum lists. The toolchain version travels as a job output.
      - name: Package and verify the crate
        id: package
        shell: bash
        run: |
          set -euo pipefail
          cargo package --locked
          mkdir crate
          cp target/package/*.crate crate/
          ls -al crate
          echo "rust=$(rustc --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Upload the crate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crate
          path: crate/*
          if-no-files-found: error

  # The candidate's manifest: the SHA-256 of every release file and of the crate, the
  # version, the commit, the toolchain and the artifacts the release needs. `just
  # deploy` checks it and those artifacts before tagging, and the release publishes
  # exactly the files it lists.
  manifest:
    name: Release manifest
    runs-on: ubuntu-latest
    needs:
      - guard
      - build
      - crate
    if: needs.guard.outputs.kind == 'candidate'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download this run's assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: artifacts

      - name: Download this run's crate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: crate
          path: crate

      # Every build of the matrix must be here with all its files, so a lost artifact
      # can never produce a partial release. Keep this in step with the build matrix.
      - name: Check the inventory
        shell: bash
        env:
          EXPECTED: dist-x86_64-unknown-linux-musl=3 dist-aarch64-unknown-linux-musl=3 dist-x86_64-apple-darwin=1 dist-aarch64-apple-darwin=1
        run: |
          set -euo pipefail
          for entry in ${EXPECTED}; do
            name="${entry%=*}"
            count="$(find "artifacts/${name}" -maxdepth 1 -type f 2>/dev/null | wc -l)"
            if [[ "${count}" -ne "${entry#*=}" ]]; then
              echo "::error::Artifact ${name} has ${count} files, expected ${entry#*=}."
              exit 1
            fi
          done
          actual="$(find artifacts -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tr '\n' ' ')"
          wanted="$(for entry in ${EXPECTED}; do echo "${entry%=*}"; done | sort | tr '\n' ' ')"
          if [[ "${actual}" != "${wanted}" ]]; then
            echo "::error::Found artifacts ${actual}, expected ${wanted}."
            exit 1
          fi

      - name: Write the manifest
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          RUST: ${{ needs.crate.outputs.rust }}
          EXPECTED: dist-x86_64-unknown-linux-musl=3 dist-aarch64-unknown-linux-musl=3 dist-x86_64-apple-darwin=1 dist-aarch64-apple-darwin=1
        run: |
          set -euo pipefail
          mkdir dist manifest
          find artifacts -type f -exec cp -n {} dist/ \;
          (cd dist && sha256sum -- *) > manifest/SHA256SUMS
          total=0
          for entry in ${EXPECTED}; do total=$((total + ${entry#*=})); done
          if [[ "$(wc -l < manifest/SHA256SUMS)" -ne "${total}" ]]; then
            echo "::error::Expected ${total} release files (a name collision?), got $(wc -l < manifest/SHA256SUMS)."
            exit 1
          fi
          (cd crate && sha256sum -- *.crate) > manifest/CRATE.SHA256
          if [[ ! "${RUST}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The crate job reported no toolchain version (got '${RUST}')."
            exit 1
          fi
          {
            echo "VERSION=${VERSION}"
            echo "COMMIT=${GITHUB_SHA}"
            echo "RUST=${RUST}"
          } > manifest/release.env
          # The artifacts the release publishes from; just deploy checks they all remain.
          { for entry in ${EXPECTED}; do echo "${entry%=*}"; done; echo crate; } > manifest/ARTIFACTS
          cat manifest/*

      # A signed statement that this run built exactly these bytes. The release publishes
      # the same files, and crates.io receives a crate with the same checksum, so
      # `gh attestation verify <file> --repo <owner>/<repo>` works on what users download.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*
            crate/*.crate

      - name: Upload the manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: manifest/*
          if-no-files-found: error

  # Only release tags (X.Y.Z) that passed the guard publish, and only the files of
  # their candidate run's manifest: nothing is rebuilt after CI. Safe to re-run: the
  # release is updated in place, existing assets are overwritten and stray ones removed;
  # it is GitHub's Latest release only when the tag is the highest promoted release at
  # that moment, so a late or recovered older tag never takes the Latest flag.
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.kind == 'release' || needs.guard.outputs.kind == 'recover'
    concurrency:
      group: gruezi-production-release
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      actions: read
    steps:
      # Full history and tags: the release notes list the commits since the previous
      # release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download the candidate run's manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          name: release-manifest
          path: ${{ runner.temp }}/manifest

      - name: Download the candidate run's assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          pattern: dist-*
          merge-multiple: true
          path: ${{ runner.temp }}/dist

      - name: Check the assets against the manifest
        shell: bash
        env:
          TAG_VERSION: ${{ needs.guard.outputs.version }}
          TAG_COMMIT: ${{ needs.guard.outputs.commit }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          . manifest/release.env
          if [[ "${VERSION}" != "${TAG_VERSION}" || "${COMMIT}" != "${TAG_COMMIT}" ]]; then
            echo "::error::The candidate manifest is for ${VERSION} at ${COMMIT}, not ${TAG_VERSION} at ${TAG_COMMIT}."
            exit 1
          fi
          listed="$(awk '{print $2}' manifest/SHA256SUMS | sort)"
          present="$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          if [[ "${listed}" != "${present}" ]]; then
            echo "::error::The downloaded assets do not match the manifest."
            diff <(echo "${listed}") <(echo "${present}") || true
            exit 1
          fi
          (cd dist && sha256sum -c ../manifest/SHA256SUMS)
          cp manifest/SHA256SUMS dist/

      # The notes are the commit subjects since the previous release (the version bump
      # itself left out), so they need no hand-kept changelog and every re-run writes the
      # same text.
      - name: Write the release notes
        shell: bash
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          previous="$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*' "refs/tags/${TAG}^" 2>/dev/null || true)"
          range="refs/tags/${TAG}"
          [[ -z "${previous}" ]] || range="${previous}..refs/tags/${TAG}"
          changes="$(git log --no-merges --format='- %s (%h)' "${range}" | grep -vE '^- bump version to [0-9]+\.[0-9]+\.[0-9]+ ' || true)"
          {
            echo "## Changes"
            echo
            echo "${changes:-- Only the version bump.}"
            if [[ -n "${previous}" ]]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${TAG}"
            fi
            echo
            echo "## Verify a download"
            echo
            echo '```sh'
            echo 'sha256sum --check --ignore-missing SHA256SUMS'
            echo "gh attestation verify <file> --repo ${GITHUB_REPOSITORY} --signer-workflow ${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            echo '```'
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Is this the latest release
        id: latest
        uses: ./.github/actions/release-is-latest
        with:
          tag: ${{ needs.guard.outputs.tag }}
          token: ${{ github.token }}

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.guard.outputs.tag }}
          draft: false
          make_latest: ${{ steps.latest.outputs.latest }}
          body_path: ${{ runner.temp }}/notes.md
          files: ${{ runner.temp }}/dist/*

      - name: Keep exactly the manifest's files on the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          expected="$(find "${RUNNER_TEMP}/dist" -maxdepth 1 -type f -printf '%f\n' | sort)"
          while read -r asset; do
            [[ -n "${asset}" ]] || continue
            if ! grep -qxF "${asset}" <<<"${expected}"; then
              echo "Removing ${asset}, which is not in the candidate manifest."
              gh release delete-asset "${TAG}" "${asset}" --repo "${GITHUB_REPOSITORY}" --yes
            fi
          done < <(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
          actual="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Release ${TAG} holds $(tr '\n' ' ' <<<"${actual}"), expected $(tr '\n' ' ' <<<"${expected}")."
            exit 1
          fi

  # Upload the crate the candidate run packaged and verified, after the GitHub release,
  # from a clean checkout of the tag. cargo cannot upload a prepared .crate, so the
  # candidate's toolchain repackages the same source without building (cargo packaging
  # is reproducible), and the crate is uploaded only when its checksum matches the
  # manifest. The upload token comes from crates.io Trusted Publishing: a short-lived
  # token minted through OIDC for this workflow, revoked when the job ends; no registry
  # secret is stored. Safe to re-run: a version crates.io already has is accepted only
  # with the candidate's checksum.
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - guard
      - release
    if: needs.guard.outputs.kind == 'release' || needs.guard.outputs.kind == 'recover'
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout the tag's sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.guard.outputs.tag }}
          persist-credentials: false

      # Outside the checkout: cargo refuses to package a working tree with files git
      # does not know about.
      - name: Download the candidate run's manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          run-id: ${{ needs.guard.outputs.candidate_run }}
          github-token: ${{ github.token }}
          name: release-manifest
          path: ${{ runner.temp }}/manifest

      # Inline rather than the local rust-toolchain action: this checkout is the tag's,
      # and tags made before that action existed must still be recoverable.
      - name: Install the candidate's toolchain
        shell: bash
        run: |
          set -euo pipefail
          . "${RUNNER_TEMP}/manifest/release.env"
          if [[ ! "${RUST}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The manifest names no exact toolchain (got '${RUST}')."
            exit 1
          fi
          rustup toolchain install "${RUST}" --profile minimal
          rustup default "${RUST}"
          rustc --version

      - name: Compare with crates.io and repackage
        id: crate
        shell: bash
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          crate="$(awk -F'"' '/^name = /{print $2; exit}' Cargo.toml)"
          expected="$(awk '{print $1}' "${RUNNER_TEMP}/manifest/CRATE.SHA256")"
          existing="$(curl -sf -A "${crate}-release" "https://crates.io/api/v1/crates/${crate}/${VERSION}" | jq -r '.version.checksum // empty' || true)"
          {
            echo "crate=${crate}"
            echo "expected=${expected}"
          } >> "$GITHUB_OUTPUT"
          if [[ -n "${existing}" ]]; then
            if [[ "${existing}" != "${expected}" ]]; then
              echo "::error::crates.io already has ${crate} ${VERSION} with checksum ${existing}, not the candidate's ${expected}."
              exit 1
            fi
            echo "${crate} ${VERSION} is already on crates.io with the candidate's checksum; nothing to publish."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo package --no-verify --locked
          actual="$(sha256sum "target/package/${crate}-${VERSION}.crate" | awk '{print $1}')"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::Repackaged crate checksum ${actual} differs from the candidate's ${expected}; not publishing."
            exit 1
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Get a crates.io token (Trusted Publishing)
        id: auth
        if: steps.crate.outputs.needed == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        if: steps.crate.outputs.needed == 'true'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATE: ${{ steps.crate.outputs.crate }}
          EXPECTED: ${{ steps.crate.outputs.expected }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          cargo publish --no-verify --locked
          for _ in $(seq 30); do
            got="$(curl -sf -A "${CRATE}-release" "https://crates.io/api/v1/crates/${CRATE}/${VERSION}" | jq -r '.version.checksum // empty' || true)"
            if [[ "${got}" == "${EXPECTED}" ]]; then
              echo "crates.io has ${CRATE} ${VERSION} with checksum ${EXPECTED}."
              exit 0
            fi
            sleep 10
          done
          echo "::error::crates.io does not report ${CRATE} ${VERSION} with checksum ${EXPECTED} yet."
          exit 1
