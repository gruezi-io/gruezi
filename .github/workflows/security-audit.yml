---
name: Security Audit

on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - deny.toml
      - .github/workflows/security-audit.yml
  workflow_call:
  workflow_dispatch:
  schedule:
    # Re-check the lockfile when new RustSec advisories are published.
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-audit:
    name: RustSec Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Cache cargo-audit
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi

      - name: Audit Cargo.lock against RustSec
        run: cargo audit

  cargo-deny:
    name: Dependencies, Licenses, and Sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: stable
          log-level: warn
          command: check
          arguments: --all-features
          command-arguments: bans licenses sources
