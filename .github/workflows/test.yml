---
name: Test

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: rustfmt

      - name: Format
        run: cargo fmt --all -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain
        with:
          components: clippy

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain

      - name: Check
        run: cargo check --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    needs:
      - format
      - lint
      - check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-toolchain

      # Release recipe and real-package tests need shell and distribution tools.
      - name: Install release test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends just zsh jq rpm rpm2cpio cpio

      - name: Prepare real-package tests
        run: |
          cargo install cargo-generate-rpm --version 0.21.0 --locked
          cargo install cargo-deb --version 3.8.0 --locked
          just test-prerequisites

      - name: test
        run: cargo test --locked
